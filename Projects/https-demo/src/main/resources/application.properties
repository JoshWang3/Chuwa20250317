spring.application.name=https-demo

# Setting up the server port
server.port=8443

# SSL configuration
server.ssl.enabled=true
server.ssl.key-store=classpath:keystore/https-demo.jks
server.ssl.key-store-password=changeit
server.ssl.key-store-type=JKS
server.ssl.key-alias=https-demo-cert
server.ssl.key-password=changeit

# Log configuration
logging.level.org.springframework.security=INFO
logging.level.com.example.httpsdemo=INFO
