<!DOCTYPE html>
<html lang="en">

<input id="input" placeholder="Type something" />
<button onclick="showLucky()">Go</button>
<p id="output"></p>

<body>
    <script>
        function showLucky() {
            const input = document.getElementById("input").value;
            const time = Date.now().toString();
            const combined = input + time;
            let total = 0;
            for (let i = 0; i < combined.length; i++) {
                total += combined.charCodeAt(i);
            }
            const lucky = (total % 100) + 1;
            document.getElementById("output").textContent = "Lucky number: " + lucky;
        }

        document.getElementById("input").addEventListener("keydown", e => {
            if (e.key === "Enter") showLucky();
        });
    </script>


</body>
