<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lucky Number Generator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px;
    }
    input {
      padding: 10px;
      width: 250px;
      font-size: 16px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      margin-left: 10px;
      cursor: pointer;
    }
    #result {
      margin-top: 30px;
      font-size: 24px;
    }
  </style>
</head>
<body>

  <h1>Lucky Number Generator</h1>
  <p>Enter anything and get your lucky number!</p>

  <input type="text" id="userInput" placeholder="Type something..." />
  <button onclick="generateLuckyNumber()">Get Lucky Number</button>

  <div id="result"></div>

  <script>
    const input = document.getElementById("userInput");
    const result = document.getElementById("result");

    function generateLuckyNumber() {
      const userValue = input.value.trim();

      const now = new Date().toISOString();
      const seed = userValue + now;

      let hash = 0;
      for (let i = 0; i < seed.length; i++) {
        hash = seed.charCodeAt(i) + ((hash << 5) - hash);
      }

      const luckyNumber = Math.abs(hash % 100) + 1;

      result.textContent = "Your lucky number is: " + luckyNumber;
    }

    input.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        generateLuckyNumber();
      }
    });
  </script>

</body>
</html>
